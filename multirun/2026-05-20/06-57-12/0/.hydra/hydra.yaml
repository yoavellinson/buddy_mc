hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: -1
    backend: null
    prefer: processes
    require: null
    verbose: 0
    timeout: null
    pre_dispatch: 2*n_jobs
    batch_size: auto
    temp_folder: null
    max_nbytes: null
    mmap_mode: r
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - tester=blind_dereverberation_binaural
    - tester.checkpoint=/home/workspace/yoavellinson/buddy_mc/experiments_binaural_to_mono/checkpoints/VCTK_16k_binaural_DPS-time-199683.pt
    - model_dir=experiments_binaural_to_mono
    - dset=vctk_16k_4s_binaural
    - +gpu=1
    - dset.test.num_examples=5
    - tester.posterior_sampling.zeta=0.3
    - tester.sampling_params.lambda_stft=0
    - tester.sampling_params.lambda_sisdr=0
  job:
    name: test_binaural
    chdir: null
    override_dirname: +gpu=1,dset.test.num_examples=5,dset=vctk_16k_4s_binaural,model_dir=experiments_binaural_to_mono,tester.checkpoint=/home/workspace/yoavellinson/buddy_mc/experiments_binaural_to_mono/checkpoints/VCTK_16k_binaural_DPS-time-199683.pt,tester.posterior_sampling.zeta=0.3,tester.sampling_params.lambda_sisdr=0,tester.sampling_params.lambda_stft=0,tester=blind_dereverberation_binaural
    id: test_binaural_0
    num: 0
    config_name: conf_VCTK_binaural_to_mono.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/workspace/yoavellinson/buddy_mc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/workspace/yoavellinson/buddy_mc/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/workspace/yoavellinson/buddy_mc/multirun/2026-05-20/06-57-12/0
    choices:
      logging: base_logging
      exp: VCTK_16k_4s_time
      tester: blind_dereverberation_binaural
      diff_params: edm_VCTK
      network: ncsnpp_binaural_to_mono
      dset: vctk_16k_4s_binaural
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: joblib
      hydra/output: default
  verbose: false
