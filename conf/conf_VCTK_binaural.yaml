defaults:
  - dset: vctk_16k_4s_binaural
  - network: ncsnpp
  - diff_params: edm_VCTK
  - tester: only_unconditional
  - exp: VCTK_16k_4s_time
  - logging: base_logging
  - override hydra/launcher: joblib
  - _self_  # Keeps your other config settings below
model_dir: "experiments"

hydra:
  job:
    config:
      # configuration for the ${hydra.job.override_dirname} runtime variable
      override_dirname:
        kv_sep: '='
        item_sep: ','
        # Remove all paths, as the / in them would mess up things
        exclude_keys: ['path_experiment',
          'hydra.job_logging.handles.file.filename']
  launcher:
    n_jobs: 4  # Matches your 4 GPUs
  sweep:
    dir: ${model_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}